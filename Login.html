<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found ICT - เข้าสู่ระบบ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #eef4fc 0%, #dbe7f6 40%, #e6f0fa 90%);
      padding: 40px 24px;
    }

    /* กล่องการ์ดหลัก */
    .login-card {
      display: flex;
      width: 100%;
      max-width: 1280px;
      min-height: 720px;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 45, 100, 0.18);
    }

    /* ฝั่งซ้าย: Banner */
    .banner-side {
      flex: 1.1;
      background: linear-gradient(135deg, rgba(30, 79, 138, 0.9) 0%, rgba(12, 59, 112, 0.94) 60%, rgba(5, 38, 76, 0.98) 100%),
                  url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1400&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    /* ขยายขนาด Lost & Found ICT ให้ใหญ่ขึ้น */
    .banner-logo {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .banner-logo i {
      font-size: 46px;
    }

    .banner-content h2 {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .banner-content p {
      font-size: 18px;
      font-weight: 400;
      color: #f1f5f9;
      line-height: 1.75;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    /* ฝั่งขวา: ฟอร์ม */
    .form-side {
      flex: 1;
      padding: 40px 64px 48px 64px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    /* แถบแท็บด้านบน */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 120px;
      border-bottom: 1.5px solid #edf2f7;
      position: relative;
      width: 100%;
    }

    .nav-tab {
      font-size: 18px;
      color: #718096;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      padding-bottom: 14px;
      transition: all 0.2s ease;
    }

    .nav-tab:hover {
      color: #003b7a;
    }

    .nav-tab.active {
      color: #003b7a;
      font-weight: 600;
    }

    /* เส้นใต้ Active Tab */
    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1.5px;
      left: -10px;
      width: calc(100% + 20px);
      height: 3px;
      background: #003b7a;
      border-radius: 3px 3px 0 0;
    }

    /* กล่องฟอร์ม - จัดกึ่งกลางแนวตั้งให้สมดุล */
    .form-content {
      margin: auto 0;
      padding: 20px 0;
      width: 100%;
    }

    /* ส่วนหัวข้อฟอร์ม */
    .form-title-group {
      text-align: center;
      margin-bottom: 32px;
    }

    .form-title-group h2 {
      font-size: 38px;
      font-weight: 700;
      color: #003b7a;
      margin-bottom: 8px;
    }

    .form-title-group p {
      font-size: 16px;
      color: #64748b;
      font-weight: 400;
    }

    /* ฟอร์มและช่องกรอก */
    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon-left {
      position: absolute;
      left: 18px;
      font-size: 18px;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 16px 50px 16px 52px;
      font-size: 16px;
      background-color: #f8faff;
      border: 1.5px solid #d9e2ec;
      border-radius: 12px;
      outline: none;
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #003b7a;
      box-shadow: 0 0 0 4px rgba(0, 59, 122, 0.1);
    }

    /* ปุ่มเปิด/ปิดตาดูรหัสผ่าน */
    .btn-toggle-password {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .btn-toggle-password:hover {
      color: #003b7a;
    }

    /* ลิงก์ลืมรหัสผ่าน */
    .forgot-link-wrapper {
      text-align: right;
      margin-top: 8px;
    }

    .forgot-link {
      font-size: 14px;
      color: #0056b3;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #002d5e;
      text-decoration: underline;
    }

    /* ปุ่ม Submit */
    .btn-login {
      width: 100%;
      padding: 17px;
      margin-top: 28px;
      background: #003b7a;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login i {
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .btn-login:hover {
      background: #002d5e;
    }

    .btn-login:hover i {
      transform: translateX(3px);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Responsive */
    @media (max-width: 992px) {
      .login-card {
        flex-direction: column;
        max-width: 580px;
      }

      .banner-side {
        min-height: 280px;
        padding: 40px;
      }

      .banner-logo {
        font-size: 32px;
      }

      .banner-logo i {
        font-size: 34px;
      }

      .form-side {
        padding: 36px 32px;
      }

      .nav-tabs {
        gap: 60px;
      }

      .banner-content h2 {
        font-size: 30px;
      }

      .form-title-group h2 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="banner-side">
      <div class="banner-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Lost & Found ICT</span>
      </div>
      <div class="banner-content">
        <h2>ค้นพบสิ่งที่หายไป<br>อย่างปลอดภัยและรวดเร็ว</h2>
        <p>ระบบจัดการทรัพย์สินสูญหาย ICT พร้อมให้บริการช่วยเหลือและติดตามทรัพย์สินตลอดเวลา</p>
      </div>
    </div>

    <div class="form-side">
      <div class="nav-tabs">
        <a href="#" class="nav-tab active">เข้าสู่ระบบ</a>
        <a href="#" class="nav-tab">ลงทะเบียน</a>
      </div>

      <div class="form-content">
        <div class="form-title-group">
          <h2>ยินดีต้อนรับ</h2>
          <p>ระบบแจ้งของหายและตามหาของภายในตึกคณะ ICT</p>
        </div>

        <form action="#" method="POST">
          <div class="form-group">
            <label for="email">อีเมล</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon-left"></i>
              <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="68xxxxxx@up.ac.th" 
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon-left"></i>
              <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="กรอกรหัสผ่าน" 
                required
              >
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
            <div class="forgot-link-wrapper">
              <a href="#" class="forgot-link">ลืมรหัสผ่าน?</a>
            </div>
          </div>

          <button type="submit" class="btn-login">
            <span>เข้าสู่ระบบ</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('togglePasswordIcon');

    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      if (type === 'text') {
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    });
  </script>

</body>
</html>
