<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found ICT - ลืมรหัสผ่าน</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #eef4fc 0%, #dbe7f6 40%, #e6f0fa 90%);
      padding: 40px 24px;
    }

    /* กล่องการ์ดเดี่ยวตรงกลาง - ขยายขนาดระดับ XL ให้สมดุล */
    .forgot-card {
      width: 100%;
      max-width: 680px;
      min-height: 720px;
      background: #ffffff;
      border-radius: 32px;
      padding: 72px 64px;
      box-shadow: 0 25px 60px -15px rgba(0, 45, 100, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ไอคอนวงกลมสีฟ้าอ่อนด้านบน */
    .icon-circle {
      width: 104px;
      height: 104px;
      background-color: #e0edff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .icon-circle i {
      font-size: 40px;
      color: #003b7a;
    }

    /* หัวข้อและคำอธิบาย */
    .form-title-group {
      text-align: center;
      margin-bottom: 40px;
    }

    .form-title-group h2 {
      font-size: 40px;
      font-weight: 700;
      color: #003b7a;
      margin-bottom: 12px;
    }

    .form-title-group p {
      font-size: 18px;
      color: #64748b;
      font-weight: 400;
      line-height: 1.7;
    }

    /* แบบฟอร์ม */
    form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 32px;
    }

    .form-group label {
      display: block;
      font-size: 17px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 10px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon-left {
      position: absolute;
      left: 20px;
      font-size: 20px;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 18px 22px 18px 58px;
      font-size: 17px;
      background-color: #f8faff;
      border: 1.5px solid #d9e2ec;
      border-radius: 14px;
      outline: none;
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #003b7a;
      box-shadow: 0 0 0 4px rgba(0, 59, 122, 0.12);
    }

    /* ปุ่มส่งลิงก์ */
    .btn-submit {
      width: 100%;
      padding: 19px;
      background: #003b7a;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: #002d5e;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* ลิงก์กลับหน้าเข้าสู่ระบบ */
    .back-link-wrapper {
      margin-top: 36px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      color: #003b7a;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .back-link i {
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .back-link:hover {
      color: #002247;
      text-decoration: underline;
    }

    .back-link:hover i {
      transform: translateX(-4px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .forgot-card {
        padding: 48px 28px;
        min-height: auto;
      }

      .icon-circle {
        width: 84px;
        height: 84px;
      }

      .icon-circle i {
        font-size: 32px;
      }

      .form-title-group h2 {
        font-size: 30px;
      }

      .form-title-group p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="forgot-card">
    
    <div class="icon-circle">
      <i class="fa-solid fa-arrow-rotate-left"></i>
    </div>

    <div class="form-title-group">
      <h2>ลืมรหัสผ่าน?</h2>
      <p>กรุณากรอกอีเมลของคุณเพื่อรับลิงก์สำหรับ<br>ตั้งรหัสผ่านใหม่</p>
    </div>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="email">อีเมล</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon-left"></i>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="xxxx@gmail.com" 
            required
          >
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>ส่งลิงก์กู้คืนรหัสผ่าน</span>
      </button>
    </form>

    <div class="back-link-wrapper">
      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>กลับไปหน้าเข้าสู่ระบบ</span>
      </a>
    </div>

  </div>

</body>
</html>
