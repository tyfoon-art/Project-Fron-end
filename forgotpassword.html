<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found ICT - ลืมรหัสผ่าน</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #eef4fc 0%, #dbe7f6 40%, #e6f0fa 90%);
      padding: 32px 24px;
    }

    /* กล่องการ์ดเดี่ยวตรงกลาง ขนาดกะทัดรัดขึ้น */
    .forgot-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 10px 30px rgba(0, 45, 100, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ไอคอนวงกลมสีฟ้าอ่อนด้านบนให้เล็กลง */
    .icon-circle {
      width: 64px;
      height: 64px;
      background-color: #e0edff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .icon-circle i {
      font-size: 24px;
      color: #003b7a;
    }

    /* หัวข้อและคำอธิบายกระชับ */
    .form-title-group {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-title-group h2 {
      font-size: 24px;
      font-weight: 700;
      color: #003b7a;
      margin-bottom: 8px;
    }

    .form-title-group p {
      font-size: 14px;
      color: #64748b;
      font-weight: 400;
      line-height: 1.5;
    }

    /* กล่องแจ้งเตือนสถานะ */
    .alert-box {
      display: none;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }

    .alert-box.error {
      background: #fef2f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .alert-box.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .alert-box.show {
      display: flex;
    }

    /* แบบฟอร์ม */
    form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon-left {
      position: absolute;
      left: 14px;
      font-size: 15px;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 16px 10px 42px;
      font-size: 13.5px;
      background-color: #f8faff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    .input-wrapper input.input-error {
      border-color: #ef4444 !important;
      background-color: #fffaf0;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-size: 13px;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #003b7a;
      box-shadow: 0 0 0 3px rgba(0, 59, 122, 0.1);
    }

    /* ปุ่มส่งลิงก์กระชับ */
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: #003b7a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(0, 59, 122, 0.15);
    }

    .btn-submit:hover {
      background: #002d5e;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* ลิงก์กลับหน้าเข้าสู่ระบบ */
    .back-link-wrapper {
      margin-top: 24px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: #003b7a;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .back-link i {
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .back-link:hover {
      color: #002247;
      text-decoration: underline;
    }

    .back-link:hover i {
      transform: translateX(-3px);
    }

    @media (max-width: 600px) {
      .forgot-card {
        padding: 32px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="forgot-card">
    
    <div class="icon-circle">
      <i class="fa-solid fa-arrow-rotate-left"></i>
    </div>

    <div class="form-title-group">
      <h2>ลืมรหัสผ่าน?</h2>
      <p>กรุณากรอกอีเมลของคุณเพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
    </div>

    <!-- กล่องแจ้งเตือนสถานะ -->
    <div class="alert-box error" id="alertError">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertErrorText">ไม่พบบัญชีอีเมลนี้ในระบบ</span>
    </div>

    <div class="alert-box success" id="alertSuccess">
      <i class="fa-solid fa-circle-check"></i>
      <span>ระบบได้ส่งลิงก์กู้คืนรหัสผ่านไปยังอีเมลของคุณเรียบร้อยแล้ว กำลังพากลับไปหน้าเข้าสู่ระบบ...</span>
    </div>

    <form id="forgotForm" onsubmit="handleSendLink(event)" novalidate>
      <div class="form-group">
        <label for="email">อีเมล</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon-left"></i>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="xxxx@gmail.com หรือ xxxx@up.ac.th" 
            oninput="clearAlert()"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>ส่งลิงก์กู้คืนรหัสผ่าน</span>
      </button>
    </form>

    <!-- ลิงก์กลับหน้าเข้าสู่ระบบ -->
    <div class="back-link-wrapper">
      <a href="login.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>กลับไปหน้าเข้าสู่ระบบ</span>
      </a>
    </div>

  </div>

  <script>
    function clearAlert() {
      document.getElementById('email').classList.remove('input-error');
      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertSuccess').classList.remove('show');
    }

    function handleSendLink(event) {
      event.preventDefault();

      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim().toLowerCase();
      const alertError = document.getElementById('alertError');
      const alertErrorText = document.getElementById('alertErrorText');
      const alertSuccess = document.getElementById('alertSuccess');
      const submitBtn = document.getElementById('submitBtn');

      if (!email) {
        emailInput.classList.add('input-error');
        alertErrorText.textContent = 'กรุณากรอกอีเมลของคุณ';
        alertError.classList.add('show');
        return;
      }

      let usersList = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
      
      const singleEmail = localStorage.getItem('userEmail');
      if (singleEmail && !usersList.some(u => u.email.toLowerCase() === singleEmail.toLowerCase())) {
        usersList.push({ email: singleEmail });
      }
      if (!usersList.some(u => u.email.toLowerCase() === '67020001@up.ac.th')) {
        usersList.push({ email: '67020001@up.ac.th' });
      }

      const foundUser = usersList.find(u => u.email.toLowerCase() === email);

      if (!foundUser) {
        emailInput.classList.add('input-error');
        alertErrorText.innerHTML = 'ไม่พบบัญชีนี้ในระบบ กรุณาตรวจสอบอีเมลหรือลงทะเบียนใหม่';
        alertError.classList.add('show');
        return;
      }

      alertError.classList.remove('show');
      alertSuccess.classList.add('show');
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    }
  </script>

</body>
</html>
