<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found ICT - ลืมรหัสผ่าน</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- components.css: ใช้เฉพาะส่วน reset พื้นฐาน (*, box-sizing, font-family)
       ร่วมกับหน้าอื่นๆ — หน้านี้ไม่มี navbar/footer จึงไม่ได้ใช้ .navbar-*/.footer-* -->
  <link rel="stylesheet" href="css/components.css">
  <!-- forgotpassword.css: สไตล์เฉพาะหน้าลืมรหัสผ่านทั้งหมด -->
  <link rel="stylesheet" href="css/forgotpassword.css">
</head>
<body>

  <div class="forgot-card">

    <div class="icon-circle">
      <i class="fa-solid fa-arrow-rotate-left"></i>
    </div>

    <div class="form-title-group">
      <h2>ลืมรหัสผ่าน?</h2>
      <p>กรุณากรอกอีเมลของคุณเพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
    </div>

    <div class="alert-box error" id="alertError">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertErrorText">ไม่พบบัญชีอีเมลนี้ในระบบ</span>
    </div>

    <div class="alert-box success" id="alertSuccess">
      <i class="fa-solid fa-circle-check"></i>
      <span>ระบบได้ส่งลิงก์กู้คืนรหัสผ่านไปยังอีเมลของคุณเรียบร้อยแล้ว กำลังพากลับไปหน้าเข้าสู่ระบบ...</span>
    </div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">อีเมล</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon-left"></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="xxxx@gmail.com หรือ xxxx@up.ac.th"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>ส่งลิงก์กู้คืนรหัสผ่าน</span>
      </button>
    </form>

    <div class="back-link-wrapper">
      <a href="login.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>กลับไปหน้าเข้าสู่ระบบ</span>
      </a>
    </div>

  </div>

  <script type="module" src="js/forgotpassword.js"></script>

</body>
</html>
