<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found ICT - ลงทะเบียน</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #eef4fc 0%, #dbe7f6 40%, #e6f0fa 90%);
      padding: 40px 24px;
    }

    /* กล่องการ์ดหลัก */
    .login-card {
      display: flex;
      width: 100%;
      max-width: 1420px;
      height: 840px;
      background: #ffffff;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 30px 70px -15px rgba(0, 45, 100, 0.22);
    }

    /* ฝั่งซ้าย: Banner */
    .banner-side {
      flex: 1.15;
      height: 100%;
      background: linear-gradient(135deg, rgba(30, 79, 138, 0.9) 0%, rgba(12, 59, 112, 0.94) 60%, rgba(5, 38, 76, 0.98) 100%),
                  url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1400&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
      padding: 72px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
    }

    .banner-logo {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
    }

    .banner-logo i {
      font-size: 52px;
    }

    .banner-content h2 {
      font-size: 46px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .banner-content p {
      font-size: 21px;
      font-weight: 400;
      color: #f1f5f9;
      line-height: 1.8;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* ฝั่งขวา: ฟอร์ม */
    .form-side {
      flex: 1;
      height: 100%;
      padding: 56px 72px 48px 72px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    /* แถบแท็บด้านบน */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 140px;
      border-bottom: 2px solid #edf2f7;
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }

    .nav-tab {
      font-size: 22px;
      color: #718096;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      padding-bottom: 16px;
      transition: all 0.2s ease;
    }

    .nav-tab:hover {
      color: #003b7a;
    }

    .nav-tab.active {
      color: #003b7a;
      font-weight: 600;
    }

    /* เส้นใต้ Active Tab */
    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -12px;
      width: calc(100% + 24px);
      height: 4px;
      background: #003b7a;
      border-radius: 4px 4px 0 0;
    }

    /* กล่องฟอร์ม */
    .form-content {
      margin-top: 28px;
      width: 100%;
    }

    /* หัวข้อฟอร์ม */
    .form-title-group {
      text-align: center;
      margin-bottom: 16px;
    }

    .form-title-group h2 {
      font-size: 40px;
      font-weight: 700;
      color: #003b7a;
      margin-bottom: 4px;
    }

    .form-title-group p {
      font-size: 16px;
      color: #64748b;
      font-weight: 400;
    }

    /* ฟอร์มและช่องกรอก */
    .form-group {
      margin-bottom: 9px;
    }

    .form-group-gender {
      margin-bottom: 6px;
    }

    .form-group label {
      display: block;
      font-size: 14.5px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon-left {
      position: absolute;
      left: 18px;
      font-size: 17px;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10.5px 54px 10.5px 52px;
      font-size: 15px;
      background-color: #f8faff;
      border: 1.5px solid #d9e2ec;
      border-radius: 12px;
      outline: none;
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #003b7a;
      box-shadow: 0 0 0 4px rgba(0, 59, 122, 0.12);
    }

    /* สไตล์ตัวเลือกเพศ */
    .gender-options {
      display: flex;
      gap: 48px;
      align-items: center;
      padding: 2px 0 2px 0;
    }

    .gender-radio {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 15.5px;
      color: #334155;
      font-weight: 500;
      padding: 3px 6px;
      border-radius: 8px;
      user-select: none;
      transition: background 0.15s ease;
    }

    .gender-radio:hover {
      background: #f1f5f9;
    }

    .gender-radio input[type="radio"] {
      appearance: none;
      width: 19px;
      height: 19px;
      border: 1.5px solid #94a3b8;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: all 0.2s;
    }

    .gender-radio input[type="radio"]::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: scale(0);
      transition: 0.15s transform ease-in-out;
      box-shadow: inset 1em 1em #003b7a;
    }

    .gender-radio input[type="radio"]:checked {
      border-color: #003b7a;
    }

    .gender-radio input[type="radio"]:checked::before {
      transform: scale(1);
    }

    .other-gender-wrapper {
      display: none;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .other-gender-wrapper.active {
      display: block;
    }

    .btn-toggle-password {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .btn-toggle-password:hover {
      color: #003b7a;
    }

    /* ปุ่ม Submit - ขยับระยะห่างลงไปด้านล่างอีกนิด */
    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #003b7a;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login i {
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .btn-login:hover {
      background: #002d5e;
    }

    .btn-login:hover i {
      transform: translateX(4px);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .login-card {
        flex-direction: column;
        max-width: 640px;
        height: auto;
      }

      .banner-side {
        min-height: 320px;
        padding: 48px 40px;
      }

      .banner-logo {
        font-size: 38px;
      }

      .banner-logo i {
        font-size: 40px;
      }

      .form-side {
        padding: 44px 36px;
      }

      .nav-tabs {
        gap: 80px;
      }

      .gender-options {
        gap: 32px;
      }

      .banner-content h2 {
        font-size: 34px;
      }

      .form-title-group h2 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="banner-side">
      <div class="banner-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Lost & Found ICT</span>
      </div>
      <div class="banner-content">
        <h2>ค้นพบสิ่งที่หายไป<br>อย่างปลอดภัยและรวดเร็ว</h2>
        <p>ระบบจัดการทรัพย์สินสูญหาย ICT พร้อมให้บริการช่วยเหลือและติดตามทรัพย์สินตลอดเวลา</p>
      </div>
    </div>

    <div class="form-side">
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab">เข้าสู่ระบบ</a>
        <a href="register.html" class="nav-tab active">ลงทะเบียน</a>
      </div>

      <div class="form-content">
        <div class="form-title-group">
          <h2>สร้างบัญชีผู้ใช้</h2>
          <p>ร่วมเป็นส่วนหนึ่งของสังคมแห่งการแบ่งปันและช่วยเหลือกัน</p>
        </div>

        <form action="#" method="POST">
          <div class="form-group">
            <label for="fullname">ชื่อ-นามสกุล</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user input-icon-left"></i>
              <input 
                type="text" 
                id="fullname" 
                name="fullname" 
                placeholder="John Doe" 
                required
              >
            </div>
          </div>

          <div class="form-group form-group-gender">
            <label>เพศ</label>
            <div class="gender-options">
              <label class="gender-radio">
                <input type="radio" name="gender" value="male" checked onclick="handleGenderChange(this)">
                <span>ชาย</span>
              </label>
              <label class="gender-radio">
                <input type="radio" name="gender" value="female" onclick="handleGenderChange(this)">
                <span>หญิง</span>
              </label>
              <label class="gender-radio">
                <input type="radio" name="gender" value="other" id="genderOtherRadio" onclick="handleGenderChange(this)">
                <span>อื่นๆ</span>
              </label>
            </div>

            <div class="other-gender-wrapper" id="otherGenderWrapper">
              <div class="input-wrapper">
                <i class="fa-solid fa-pen input-icon-left"></i>
                <input 
                  type="text" 
                  id="other_gender_text" 
                  name="other_gender" 
                  placeholder="ระบุเพศของคุณ" 
                  oninput="this.value = this.value.replace(/[^a-zA-Zก-๙\s]/g, '')"
                >
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="email">อีเมล</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon-left"></i>
              <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="xxxx@gmail.com" 
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon-left"></i>
              <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="กรอกรหัสผ่าน" 
                required
              >
              <button type="button" class="btn-toggle-password" onclick="togglePass('password', 'togglePassIcon1')" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye" id="togglePassIcon1"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">ยืนยันรหัสผ่าน</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon-left"></i>
              <input 
                type="password" 
                id="confirm-password" 
                name="confirm_password" 
                placeholder="กรอกยืนยันรหัสผ่าน" 
                required
              >
              <button type="button" class="btn-toggle-password" onclick="togglePass('confirm-password', 'togglePassIcon2')" aria-label="Toggle confirm password visibility">
                <i class="fa-regular fa-eye" id="togglePassIcon2"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login">
            <span>ลงทะเบียน</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function handleGenderChange(radio) {
      const otherWrapper = document.getElementById('otherGenderWrapper');
      const otherInput = document.getElementById('other_gender_text');
      
      if (radio.value === 'other') {
        otherWrapper.classList.add('active');
        otherInput.required = true;
        otherInput.focus();
      } else {
        otherWrapper.classList.remove('active');
        otherInput.required = false;
        otherInput.value = '';
      }
    }
  </script>

</body>
</html>
